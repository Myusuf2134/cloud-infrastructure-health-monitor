monitoring:
  interval_seconds: 30

thresholds:
  cpu: {warning: 75, critical: 90}
  memory: {warning: 80, critical: 95}
  disk: {warning: 80, critical: 90}

network_checks:
  - name: Local Web Server
    host: 127.0.0.1
    port: 8000
    timeout_seconds: 2

http_checks:
  - name: Local Health Endpoint
    url: http://127.0.0.1:8000/health
    expected_status: 200
    timeout_seconds: 5

process_checks:
  - name: SSH daemon
    process_name: sshd
